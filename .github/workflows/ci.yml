name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test generic and EvoMap validation
        run: python3 -I scripts/test_validate_article.py
      - name: Check public package
        run: python3 -I scripts/check_release.py
      - name: Validate the synthetic writing example
        run: python3 -I scripts/validate_article.py --article examples/insight.md --manifest examples/manifest.json --profile generic --no-local
